name: Bug report
description: Create a bug report
type: Bug
labels: [ bug ]
body:
  - type: markdown
    id: introduction
    attributes:
      value: |
        ### Thank you for taking the time to report an issue!

        Prowlogue is an Apple TV client for [Jellyfin](https://jellyfin.org), built on
        [Swiftfin](https://github.com/jellyfin/Swiftfin). If the problem is with your **server**
        (libraries, metadata, transcoding, plugins), please report it to Jellyfin instead — this
        tracker is for the Prowlogue app itself.

  - type: checkboxes
    id: before-posting
    attributes:
      label: "This issue respects the following points:"
      description: Please help us by ensuring that you meet all the following conditions.
      options:
        - label: This is a **bug**, not a question or a configuration issue; please visit our [Discord](https://discord.gg/e8A3D9P7fk) first to troubleshoot, before creating a report.
          required: true
        - label: This issue is **not** already reported on [GitHub](https://github.com/prowlogue/prowlogue/issues?q=is%3Aopen+is%3Aissue).
          required: true
        - label: I'm using an up to date version of Prowlogue; We generally do not support previous older versions. If possible, please update to the latest version before opening an issue.
          required: true
        - label: I agree to follow Jellyfin's [Code of Conduct](https://jellyfin.org/docs/general/community-standards.html#code-of-conduct).
          required: true

  - type: textarea
    id: description
    attributes:
      label: Description of the bug
      description: Please provide a detailed description of the bug you encountered, in a readable and comprehensible way.
      placeholder: |
        After updating, the playback controls disappear when playing certain video files. The issue seems to occur specifically with files that have multiple audio tracks. I have tested this on two different Apple TVs with the same results.
    validations:
      required: true

  - type: textarea
    id: repro-steps
    attributes:
      label: Reproduction steps
      description: Provide clear, step-by-step instructions that anyone can follow to reproduce this issue.
      placeholder: |
        1. Open Prowlogue and navigate to your library
        2. Select a video file with multiple audio tracks
        3. Start playback
        4. Press the touchpad to bring up the playback controls
        5. Observe that controls do not appear
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: Application version
      description: The version of the installed Prowlogue app, shown at the bottom of Settings.
      placeholder: 1.0 (8)
    validations:
      required: true

  - type: dropdown
    id: installation-source
    attributes:
      label: Where did you install the app from?
      description: Choose the appropriate installation method.
      options:
        - App Store
        - TestFlight

  - type: input
    id: device-info
    attributes:
      label: Device information
      description: Apple TV model
      placeholder: Apple TV 4K (3rd gen), Apple TV 4K (2nd gen), Apple TV HD
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: tvOS version
      description: Version of tvOS on the device. Prowlogue requires tvOS 26 or later.
      placeholder: tvOS 26.0
    validations:
      required: true

  - type: input
    id: server-version
    attributes:
      label: Jellyfin server version
      description: The version of your Jellyfin server. If on unstable, please specify the commit hash.
      placeholder: 10.11.0
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or videos
      description: Attach relevant screenshots or videos that demonstrate the issue.

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output if available. This can help diagnose the issue faster.
      render: shell
